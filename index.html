<!-- Sistema de abertura do link -->
<script>
(function () {

  /* Mesmo comportamento do site funcional */
  const target_blank = true;

  window.abrirWhatsApp = function (event, targetUrl) {

    event.preventDefault();

    if (target_blank) {

      window.open(
        targetUrl,
        "_blank",
        "noopener,noreferrer"
      );

    } else {

      window.location.href = targetUrl;

    }

  };

})();
</script>
