<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@Tacadapro</title>
  <!-- Ícones Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Botões do topo */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #222222;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
    }

    /* Perfil */
    .profile-img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
    }

    .username {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .bio {
      font-size: 14px;
      color: #dddddd;
      text-align: center;
      margin-bottom: 24px;
    }

    /* Card Principal */
    .card-link {
      width: 100%;
      background-color: #121212;
      border: 1px solid #222222;
      border-radius: 20px;
      overflow: hidden;
      text-decoration: none;
      color: #ffffff;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card-link:hover {
      transform: translateY(-2px);
      border-color: #333333;
    }

    .card-banner {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .card-footer {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #ffffff;
    }

    .card-footer-text {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Rodapé */
    .footer-links {
      margin-top: auto;
      padding-top: 40px;
      padding-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      color: #888888;
    }

    .footer-links a {
      color: #888888;
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Topo com botões -->
    <div class="top-bar">
      <a href="#" class="icon-btn" title="Opções"><i class="fa-solid fa-asterisk"></i></a>
      <a href="#" class="icon-btn" title="Compartilhar"><i class="fa-solid fa-arrow-up-from-bracket"></i></a>
    </div>

    <!-- Foto e Informações de Perfil -->
    <!-- Substitua 'logo.jpg' pelo caminho da sua imagem de perfil -->
    <img class="profile-img" src="https://via.placeholder.com/150/ff0000/ffffff?text=LOGO" alt="Tacada Pro" />
    
    <h1 class="username">@Tacadapro</h1>
    <p class="bio">Software lucrativo e confiável. 🎱💰</p>

    <!-- Card com Banner / Botão -->
    <!-- Altere o 'href' para o seu link do WhatsApp -->
    <a href="https://wa.me/SEUNUMERO" target="_blank" class="card-link">
      <!-- Substitua 'banner.jpg' pela imagem do seu banner -->
      <img class="card-banner" src="https://via.placeholder.com/600x350/000000/00ff00?text=Sua+Imagem+do+Banner+Aqui" alt="Banner do Curso" />
      
      <div class="card-footer">
        <span class="card-footer-text">
          Tenha acesso a ferramenta clicando acima ℹ️
        </span>
        <i class="fa-solid fa-ellipsis-vertical" style="color: #666;"></i>
      </div>
    </a>

    <!-- Rodapé Estilo Linktree -->
    <div class="footer-links">
      <a href="#">Cookie Preferences</a> •
      <a href="#">Report</a> •
      <a href="#">Privacy</a> •
      <a href="#">About this account</a> •
      <a href="#">More from Linktree</a>
    </div>
  </div>

</body>
</html>
