<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@Tacadapro</title>
  <!-- Ícones Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 15px;
      position: relative;
    }

    /* Imagem de Fundo de Sinuca Transparente/Sombreada */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&w=1080&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.25;
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* Botões do topo */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: rgba(34, 34, 34, 0.8);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
    }

    /* Perfil */
    .profile-img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .username {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .bio {
      font-size: 14px;
      color: #dddddd;
      text-align: center;
      margin-bottom: 24px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Card Principal */
    .card-link {
      width: 100%;
      background-color: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid #222222;
      border-radius: 20px;
      overflow: hidden;
      text-decoration: none;
      color: #ffffff;
      transition: transform 0.2s ease, border-color 0.2s ease;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }

    .card-link:hover {
      transform: translateY(-2px);
      border-color: #333333;
    }

    .card-banner {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .card-footer {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Estilo da frase destacada */
    .card-footer-text {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    }

    /* Botão Verde WhatsApp */
    .btn-whatsapp {
      width: 100%;
      background-color: #25d366;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      padding: 16px 20px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
      transition: transform 0.2s ease, background-color 0.2s ease;
      margin-bottom: 24px;
    }

    .btn-whatsapp:hover {
      background-color: #20ba5a;
      transform: translateY(-2px);
    }

    .btn-whatsapp i {
      font-size: 22px;
    }

    /* Rodapé */
    .footer-links {
      margin-top: auto;
      padding-top: 20px;
      padding-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      color: #888888;
    }

    .footer-links a {
      color: #888888;
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Topo com botões -->
    <div class="top-bar">
      <a href="#" class="icon-btn" title="Opções"><i class="fa-solid fa-asterisk"></i></a>
      <a href="#" class="icon-btn" title="Compartilhar"><i class="fa-solid fa-arrow-up-from-bracket"></i></a>
    </div>

    <!-- Foto do Perfil -->
    <img class="profile-img" src="23.PNG" alt="Tacadinhas MOD" />
    
    <h1 class="username">@Tacadapro</h1>
    <p class="bio">Software lucrativo e confiável. 🎱💰</p>

    <!-- Card com Banner -->
    <a href="https://wa.me/SEUNUMERO" target="_blank" class="card-link">
      <img class="card-banner" src="22.PNG" alt="Entra em contato pelo WhatsApp" />
      
      <div class="card-footer">
        <span class="card-footer-text">
          Tenha acesso à ferramenta clicando no botão verde abaixo ⬇️
        </span>
        <i class="fa-solid fa-ellipsis-vertical" style="color: #888;"></i>
      </div>
    </a>

    <!-- Botão Verde WhatsApp -->
    <a href="https://wa.me/SEUNUMERO" target="_blank" class="btn-whatsapp">
      <i class="fa-brands fa-whatsapp"></i>
      FALAR NO WHATSAPP
    </a>

    <!-- Rodapé Estilo Linktree -->
    <div class="footer-links">
      <a href="#">Cookie Preferences</a> •
      <a href="#">Report</a> •
      <a href="#">Privacy</a> •
      <a href="#">About this account</a> •
      <a href="#">More from Linktree</a>
    </div>
  </div>

</body>
</html>
